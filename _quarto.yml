# Project defaults for every .qmd under this folder, so a document does not have
# to name its own Word template or stylesheet. Here it serves two purposes: it
# makes example/smoke-test.qmd renderable, and it is the file to copy into a
# document repository as a starting point.
#
# Paths below are relative to the folder holding this file. In a document
# repository that keeps QuartoTools as a sibling checkout, write them as
# ../QuartoTools/templates/hebrew.docx and so on.
#
# Render with render.py, which also rasterizes SVG figures; Word cannot embed SVG.
project:
  type: default

# Hebrew, right to left, for every document unless it says otherwise. The tag
# must be he-IL and not he: with the bare tag Word picks the wrong font, which
# is the bug templates/hebrew.docx exists to fix. See upstream/pandoc-issue-lang-bidi.md.
lang: he-IL
dir: rtl

# Keep quotes as typed. Pandoc's smart-quotes extension curls " and ', which is
# wrong in Hebrew: ז"ל comes out as ז”ל and גב' as גב’, and it cannot pair the
# quote in an acronym like ה"פער".
from: markdown-smart

format:
  docx:
    reference-doc: templates/hebrew.docx
    # Pandoc cannot embed SVG in .docx, so Word gets the rasterized copy that
    # scripts/rasterize_svg.py writes beside each vector original. render.py
    # runs the rasterizer before calling quarto.
    # auto-direction also marks the tables that must be laid out right to
    # left; render.py finishes that job after quarto is done, because a table's
    # layout direction cannot be set from a filter.
    # wrap-figure marks the figures in a .wrap-left / .wrap-right div, which
    # render.py then floats in text boxes; it must come before auto-direction.
    filters: [filters/straight-header-quotes.lua, filters/svg-to-png.lua, filters/wrap-figure.lua, filters/auto-direction.lua]
  html:
    css: rtl-fixes.css
    # The same filter gives each table its direction here, as a dir attribute.
    # Paragraphs need no filter in HTML: rtl-fixes.css sets unicode-bidi:
    # plaintext, which is the same rule expressed natively.
    filters: [filters/straight-header-quotes.lua, filters/wrap-figure.lua, filters/auto-direction.lua]
